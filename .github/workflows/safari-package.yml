name: Safari package

on:
  pull_request:
    paths: [apple/**, extension/**, public/js/media.js, build/**, package*.json, test/**, .github/workflows/safari-package.yml]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:safari
      - run: npm run build:safari:xcode -- --bundle-id com.watchparty.validation --ios-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-party-safari-source
          path: public/ext/watch-party-safari-source.zip
          if-no-files-found: error
          retention-days: 14
