<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="none" class="none" hidden>
    <img src="icon48.png" alt="">
    <h1>Watch Party</h1>
    <p>Open your Watch Party page in a tab (the invite link). When the host plays something from Netflix, Prime Video, Hulu or another service, the party shows up here, right next to the video.</p>
  </div>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="title">
        <div class="svc" id="svc">Watch Party</div>
        <div class="name" id="title">Nothing playing</div>
      </div>
      <button class="icon-btn" id="bigBtn" type="button" title="Fill the screen (the panel stays)" aria-label="Fill the screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="partyBtn" type="button" title="Go to the Watch Party tab" aria-label="Go to the Watch Party tab">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </header>

    <div class="notice" id="notice" hidden></div>

    <section class="player">
      <div class="seek" id="seek"><div class="seek-fill" id="seekFill"></div></div>
      <div class="ctrl-row">
        <button class="ctrl" id="backBtn" type="button" title="Back 10 seconds" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><text x="12" y="15.5" text-anchor="middle">10</text></svg>
        </button>
        <button class="ctrl play" id="playBtn" type="button" title="Play / pause" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7z" class="fill"/></svg>
        </button>
        <button class="ctrl" id="fwdBtn" type="button" title="Forward 10 seconds" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/><text x="12" y="15.5" text-anchor="middle">10</text></svg>
        </button>
        <div class="time" id="time">0:00 / 0:00</div>
      </div>
    </section>

    <section class="cams" id="cams"></section>

    <div class="me-row">
      <button class="pill" id="camBtn" type="button">Camera off</button>
      <button class="pill" id="micBtn" type="button">Mic off</button>
      <div class="reacts" id="reacts"></div>
    </div>

    <details class="people" id="peopleBox" open>
      <summary id="peopleSum">Here now</summary>
      <div id="people"></div>
    </details>

    <section class="chat">
      <div class="chat-list" id="chatList"></div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <button class="emoji-btn" id="emojiBtn" type="button" aria-label="Add emoji" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9h.01M15 9h.01"/></svg>
        </button>
        <div class="emoji-picker" id="emojiPicker" hidden></div>
        <input id="chatInput" maxlength="500" placeholder="Say something…">
        <button class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
        </button>
      </form>
    </section>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
